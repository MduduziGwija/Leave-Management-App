# Tests the app, then publishes it to GitHub Pages whenever main changes.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: mkdir _site && cp -r index.html css js vendor templates _site/
      # Public demo at /demo/: same app with made-up staff, data kept in the visitor's browser,
      # not connected to the real database.
      - name: Add the public demo
        run: |
          mkdir _site/demo && cp -r index.html css js vendor templates _site/demo/
          sed -i -E "s#SUPABASE_URL: '[^']*'#SUPABASE_URL: ''#; s#SUPABASE_ANON_KEY: '[^']*'#SUPABASE_ANON_KEY: ''#" _site/demo/js/config.js
          grep -q "SUPABASE_URL: ''" _site/demo/js/config.js
          # Anonymous visit counts for the demo only; the real app is not tracked.
          sed -i -e '/<\/head>/{r tools/demo-analytics.html' -e 'N}' _site/demo/index.html
          grep -q "cloud.umami.is" _site/demo/index.html
          ! grep -q "cloud.umami.is" _site/index.html
      # Browsers keep files for a while, so each deploy stamps every file reference with the
      # commit id. Phones then fetch the new version straight away instead of mixing old and new.
      - name: Stamp file references with this version
        run: |
          bash tools/stamp-version.sh _site "${GITHUB_SHA::8}"
          bash tools/stamp-version.sh _site/demo "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
