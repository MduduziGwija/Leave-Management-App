# Tests the app, then publishes it to GitHub Pages whenever main changes.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: mkdir _site && cp -r index.html css js vendor templates _site/
      # Browsers keep files for a while, so each deploy stamps every file reference with the
      # commit id. Phones then fetch the new version straight away instead of mixing old and new.
      - name: Stamp file references with this version
        run: bash tools/stamp-version.sh _site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
